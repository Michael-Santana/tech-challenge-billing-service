spring:
  application:
    name: billing-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/billing_service}
    username: ${DATABASE_USER:billing}
    password: ${DATABASE_PASSWORD:billing}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api/v1
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
app:
  api-key: ${BILLING_API_KEY:}
  os-url: ${OS_SERVICE_URL:http://localhost:8081/api/v1}
  mercado-pago:
    base-url: ${MERCADO_PAGO_BASE_URL:https://api.mercadopago.com}
    access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
    notification-url: ${MERCADO_PAGO_NOTIFICATION_URL:}
  exchange: ${BILLING_EXCHANGE:billing.exchange}
