services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billing_service
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-billing}
    ports:
      - "5433:5432"
    volumes:
      - billing-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing_service"]
      interval: 5s
      timeout: 3s
      retries: 10
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  billing:
    build: .
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/billing_service
      DATABASE_USER: billing
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-billing}
      RABBITMQ_HOST: rabbitmq
      OS_SERVICE_URL: ${OS_SERVICE_URL:-http://host.docker.internal:8081/api/v1}
      BILLING_API_KEY: ${BILLING_API_KEY:?Configure BILLING_API_KEY}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
      MERCADO_PAGO_NOTIFICATION_URL: ${MERCADO_PAGO_NOTIFICATION_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
volumes:
  billing-db:
